events {
}

http {

    include mime.types;

    server {
        listen          8080;
        root            /usr/share/nginx/html/example.com;
    }

    server {
        listen          80;
        server_name     ramandeep.linkpc.net www.ramandeep.linkpc.net;

        root            /usr/share/nginx/html/sample.com;

        # if at / path index.html not exist then it goes to 404
        location / {
            try_files $uri $uri/ =404;
        }

        error_page      404  /404.html;

        access_log      /var/log/nginx/ramandeep.access.log;
        error_log       /var/log/nginx/ramandeep.error.log;

    }
}
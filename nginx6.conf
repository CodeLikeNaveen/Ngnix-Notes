events {
}

http {

    include mime.types;

    server {
        listen          8080;
        root            /usr/share/nginx/html/example.com;
    }

    server {
        listen          443 ssl http2;
        server_name     ramandeep.linkpc.net www.ramandeep.linkpc.net;

        root            /usr/share/nginx/html/sample.com;

        ssl_certificate         /etc/letsencrypt/live/ramandeep.linkpc.net/fullchain.pem;
        ssl_certificate_key     /etc/letsencrypt/live/ramandeep.linkpc.net/privkey.pem;

        ssl_protocols   TLSv1.2 TLSv1.3;

        location / {
            try_files $uri $uri/ =404;
        }

        error_page      404  /404.html;

        access_log      /var/log/nginx/ramandeep.access.log;
        error_log       /var/log/nginx/ramandeep.error.log;

    }
}